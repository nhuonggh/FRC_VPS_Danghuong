# =============================================================================
# CI/CD: test (gate) → build 2 image → scp lên VPS → docker load → migrate/seed → swap (khuôn skill setup-project, bỏ registry)
# Secret KHÔNG viết ở đây — đặt trong GitHub Secrets (docs/infra/RUNBOOK.md mục GitHub Secrets).
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Hai lần deploy không bao giờ chồng nhau (lần sau chờ lần trước xong, không huỷ giữa chừng)
concurrency:
  group: deploy-dherp
  cancel-in-progress: false

env:
  SLUG: dherp
  IMAGE_NAME: dherp
  APP_PORT: ${{ secrets.APP_PORT }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Bộ test chạy tuần tự trên 1 DB thật (~8 phút ở máy dev) → chừa dư
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dh_test
        ports:
          - 5434:5432 # khớp .env.test (localhost:5434/dh_test)
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      # Một tiến trình vitest duy nhất (vitest.config.mts: fileParallelism: false — các file dùng chung 1 DB).
      # Env lấy từ .env.test (tests/setup-env.ts), DB là service postgres ở trên.
      - run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Image KHÔNG đi qua registry dùng chung (registry.francophiles.com.vn đang hỏng dữ liệu blob — xem RUNBOOK mục 3):
      # build → tar.gz → scp lên VPS → docker load. LUÔN ghi rõ target (pitfalls mục 1).
      - name: Build app image (target runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/dherp-app.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image (target migrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:migrate-${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/dherp-migrate.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress images
        run: gzip -1 /tmp/dherp-app.tar /tmp/dherp-migrate.tar && ls -la /tmp/dherp-*.tar.gz

      - name: Upload images to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: /tmp/dherp-app.tar.gz,/tmp/dherp-migrate.tar.gz
          target: deploy
          strip_components: 1
          overwrite: true

      # --- Deploy: migrate + seed TRƯỚC, fail thì container cũ vẫn chạy; rồi mới swap; rồi probe sức khoẻ ---
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,APP_PORT,SLUG
          script: |
            set -eu
            ENV_FILE="$HOME/app/.env"                  # app: NODE_ENV, DATABASE_URL (app_rw), AUTH_SECRET, NEXTAUTH_URL
            MIGRATE_ENV_FILE="$HOME/app/.env.migrate"  # migrator: MIGRATE_DATABASE_URL (owner), BOOTSTRAP_ADMIN_PASSWORD
            for f in "$ENV_FILE" "$MIGRATE_ENV_FILE"; do [ -f "$f" ] || { echo "!! Thiếu $f"; exit 1; }; done
            if grep -qE "^(MIGRATE_DATABASE_URL|BOOTSTRAP_ADMIN_PASSWORD)=" "$ENV_FILE"; then
              echo "!! $ENV_FILE chứa biến của migrator — chuyển sang .env.migrate (RUNBOOK mục 4)"; exit 1
            fi
            APP_IMAGE="$IMAGE_NAME:$IMAGE_TAG"
            MIGRATE_IMAGE="$IMAGE_NAME:migrate-$IMAGE_TAG"

            echo "==> Nạp image từ file đã upload ($IMAGE_TAG)"
            docker load -i "$HOME/deploy/dherp-app.tar.gz"
            docker load -i "$HOME/deploy/dherp-migrate.tar.gz"
            rm -f "$HOME/deploy/dherp-app.tar.gz" "$HOME/deploy/dherp-migrate.tar.gz"

            PREV_IMAGE="$(docker inspect --format '{{.Config.Image}}' "${SLUG}_app" 2>/dev/null || echo none)"
            echo "==> Image đang chạy trước deploy (dùng để rollback): $PREV_IMAGE"

            echo "==> Migrate TRƯỚC (fail thì container cũ vẫn chạy)"
            docker run --rm --network pgnet --env-file "$MIGRATE_ENV_FILE" "$MIGRATE_IMAGE"

            echo "==> Seed (idempotent: quyền, vai trò, công ty, kỳ đầu, admin khởi tạo nếu bảng users trống)"
            docker run --rm --network pgnet --env-file "$MIGRATE_ENV_FILE" "$MIGRATE_IMAGE" npx prisma db seed

            echo "==> Swap app container"
            docker stop "${SLUG}_app" 2>/dev/null || true
            docker rm   "${SLUG}_app" 2>/dev/null || true
            docker run -d \
              --name "${SLUG}_app" \
              --restart always \
              --network pgnet \
              --env-file "$ENV_FILE" \
              -p "127.0.0.1:${APP_PORT}:3000" \
              "$APP_IMAGE"

            echo "==> Health probe /api/health (tối đa ~60s)"
            ok=0
            for i in $(seq 1 30); do
              if docker exec "${SLUG}_app" node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                ok=1; break
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "!! App không phản hồi /api/health. Log gần nhất:"
              docker logs --tail 80 "${SLUG}_app" || true
              echo "!! Rollback: xem docs/infra/RUNBOOK.md mục Rollback (image trước: $PREV_IMAGE)"
              exit 1
            fi
            if command -v curl >/dev/null 2>&1; then
              curl -fsS --max-time 5 "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null
              echo "==> Cổng host 127.0.0.1:${APP_PORT} OK"
            fi
            echo "==> App healthy: $APP_IMAGE"

            echo "==> Dọn image CỦA DỰ ÁN NÀY: giữ 3 bản app + 3 bản migrate gần nhất (image đang chạy không bị xoá)"
            docker images "$IMAGE_NAME" --format '{{.Tag}}' | grep -E '^[0-9a-f]{40}$' | tail -n +4 \
              | xargs -r -I{} docker rmi "$IMAGE_NAME:{}" || true
            docker images "$IMAGE_NAME" --format '{{.Tag}}' | grep -E '^migrate-[0-9a-f]{40}$' | tail -n +4 \
              | xargs -r -I{} docker rmi "$IMAGE_NAME:{}" || true
            # CHỈ image lơ lửng mang nhãn project=dherp (Dockerfile) — không bao giờ prune toàn VPS
            docker image prune -f --filter "label=project=dherp"
